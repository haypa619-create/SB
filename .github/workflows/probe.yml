name: Probe
on:
  push:
    branches: [probe4]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava || true
      - name: Probe
        run: |
          set +e +o pipefail
          MC=/home/runner/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged-deobf/26.2/minecraft-merged-deobf-26.2.jar
          out=probe.txt; : > $out
          javap -cp "$MC" net.minecraft.world.inventory.ContainerInput >> $out
          javap -p -cp "$MC" net.minecraft.client.gui.screens.inventory.AbstractSignEditScreen | grep -iE "done|onClose|keyPressed" >> $out
          javap -cp "$MC" net.minecraft.client.multiplayer.MultiPlayerGameMode | grep -iE "click|container" >> $out
          javap -cp "$MC" net.minecraft.world.inventory.AbstractContainerMenu | grep -iE "containerId" >> $out
          javap -cp "$MC" com.mojang.blaze3d.platform.InputConstants | grep -E "KEY_RETURN|KEY_NUMPADENTER|KEY_SPACE" >> $out
          split -b 3500 $out part_
          for f in part_*; do msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' $f); echo "::warning title=probe $f::$msg"; done
