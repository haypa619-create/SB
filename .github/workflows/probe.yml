name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava --stacktrace || true
      - name: Probe
        run: |
          set +e +o pipefail
          MC=/home/runner/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged-deobf/26.2/minecraft-merged-deobf-26.2.jar
          out=probe.txt; : > $out
          javap -p -cp "$MC" net.minecraft.client.gui.screens.inventory.AbstractContainerScreen | grep -iE "leftPos|topPos|hoveredSlot|imageWidth|extract|Slot|menu" >> $out
          javap -cp "$MC" net.minecraft.world.inventory.Slot | grep -E "int x|int y|getItem|isActive|container|index" >> $out
          javap -cp "$MC" net.minecraft.world.inventory.AbstractContainerMenu | grep -E "slots" >> $out
          javap -cp "$MC" net.minecraft.client.gui.GuiGraphicsExtractor | grep -iE "fill|outline|text|pose" >> $out
          javap -cp "$MC" net.minecraft.world.item.ItemStack | grep -iE "getHoverName|isEmpty|getCustomName" >> $out
          split -b 3500 $out part_
          for f in part_*; do msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' $f); echo "::warning title=probe $f::$msg"; done
