name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava --stacktrace || true
      - name: Probe
        run: |
          out=probe.txt; : > $out
          SCREEN=$(find ~/.gradle /home/runner/work -name 'fabric-screen-api-v1*.jar' 2>/dev/null | grep -v sources | head -1)
          echo "screenjar $SCREEN" >> $out
          javap -cp "$SCREEN" 'net.fabricmc.fabric.api.client.screen.v1.ScreenEvents' >> $out 2>&1
          for c in $(unzip -l "$SCREEN" | grep -o 'net/fabricmc/fabric/api/client/screen/v1/ScreenEvents\$[A-Za-z]*\.class'); do
            javap -cp "$SCREEN" "${c%.class}" >> $out 2>&1; done
          MC=$(find ~/.gradle /home/runner/work -name '*.jar' 2>/dev/null | xargs -I{} sh -c 'unzip -l {} 2>/dev/null | grep -q "net/minecraft/client/gui/screens/inventory/AbstractContainerScreen.class" && echo {}' | head -1)
          echo "mcjar $MC" >> $out
          javap -p -cp "$MC" net.minecraft.client.gui.screens.inventory.AbstractContainerScreen | grep -iE "leftPos|topPos|hoveredSlot|imageWidth|render|extract|Slot" >> $out 2>&1
          javap -cp "$MC" net.minecraft.world.inventory.Slot | grep -E " x;| y;|getItem|isActive|index" >> $out 2>&1
          unzip -l "$MC" | grep -oE 'net/minecraft/client/gui/GuiGraphics[A-Za-z]*\.class' >> $out
          for g in GuiGraphics GuiGraphicsExtractor; do javap -cp "$MC" net.minecraft.client.gui.$g 2>/dev/null | grep -E "fill|renderOutline|submitOutline|outline|pose" >> $out; done
          javap -cp "$MC" net.minecraft.client.gui.screens.Screen | grep -iE "render|extract" >> $out
          msg=$(head -c 60000 $out | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::warning title=probe::$msg"
