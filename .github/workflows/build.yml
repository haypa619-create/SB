name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          {
            sed -n '/What went wrong/,/Try:/p' build.log
            grep -A3 -E "error:" build.log
          } | head -80 > errors.txt
          msg=$(cat errors.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Build errors::$msg"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bazaar-helper
          path: build/libs/*.jar
